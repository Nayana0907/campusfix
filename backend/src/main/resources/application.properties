spring.application.name=campusfix-backend

# Server Configuration
server.port=${PORT:8080}

# MySQL Datasource Configuration
spring.datasource.url=${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/campusfix}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:123@123}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.cookie.secure=${APP_COOKIE_SECURE:${COOKIE_SECURE:false}}
app.jwt.cookie.same-site=${COOKIE_SAME_SITE:Lax}

# Backward compatibility aliases for existing jwt properties
jwt.secret=${app.jwt.secret}
jwt.expiration-ms=${app.jwt.expiration-ms}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://campusfix-phi.vercel.app,http://localhost:3000,http://localhost:5173}

# File Upload Configuration
app.complaint.upload.dir=${COMPLAINT_UPLOAD_DIR:uploads/complaints}
app.complaint.upload.max-file-size-bytes=5242880
app.complaint.upload.max-images-per-complaint=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Resolution Verification System Configuration
app.verification.timeout-hours=${VERIFICATION_TIMEOUT_HOURS:72}
app.verification.reminders-enabled=${VERIFICATION_REMINDERS_ENABLED:true}
app.verification.reminder-interval-hours=${VERIFICATION_REMINDER_INTERVAL_HOURS:24}
app.verification.reminder-check-interval-ms=${VERIFICATION_REMINDER_CHECK_INTERVAL_MS:60000}
app.verification.admin-override-enabled=${VERIFICATION_ADMIN_OVERRIDE_ENABLED:false}
app.verification.admin-override-delay-hours=${VERIFICATION_ADMIN_OVERRIDE_DELAY_HOURS:72}

# Analytics & SLA Dashboard Configuration
app.analytics.reporting-timezone=${ANALYTICS_TIMEZONE:UTC}
app.analytics.max-range-days=${ANALYTICS_MAX_RANGE_DAYS:366}
app.analytics.sla.low-hours=${ANALYTICS_SLA_LOW_HOURS:72}
app.analytics.sla.medium-hours=${ANALYTICS_SLA_MEDIUM_HOURS:48}
app.analytics.sla.high-hours=${ANALYTICS_SLA_HIGH_HOURS:24}
app.analytics.sla.urgent-hours=${ANALYTICS_SLA_URGENT_HOURS:12}
app.analytics.recurring-issue-threshold=${ANALYTICS_RECURRING_THRESHOLD:2}