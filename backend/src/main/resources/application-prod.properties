# ==============================================================================
# CampusFix Backend — Production Configuration Profile (application-prod.properties)
# Activate with: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Server
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never

# Production MySQL Database Connection
# Automatically accepts DB_URL, cloud provider DATABASE_URL (Render/Railway), or SPRING_DATASOURCE_URL
spring.datasource.url=${spring.datasource.url:${DB_URL:${DATABASE_URL:${SPRING_DATASOURCE_URL:}}}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings for Production (Optimized for cloud free tier)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA / Hibernate: auto-update schema for fresh cloud deployments
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring SQL Initialization: automatically execute schema.sql on startup
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Security: Secrets (can be configured via environment variable)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Cookie Settings for cross-origin production deployments (SameSite=None; Secure required)
app.jwt.cookie.secure=${APP_COOKIE_SECURE:${COOKIE_SECURE:true}}
app.jwt.cookie.same-site=${COOKIE_SAME_SITE:None}

# CORS Configuration (Production default permits deployed Vercel frontend, override via CORS_ALLOWED_ORIGINS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://campusfix-phi.vercel.app}

# File Upload Configuration (Use app directory writable by non-root container user)
app.complaint.upload.dir=${COMPLAINT_UPLOAD_DIR:/app/uploads/complaints}
app.complaint.upload.max-file-size-bytes=5242880
app.complaint.upload.max-images-per-complaint=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Resolution Verification System Configuration
app.verification.timeout-hours=${VERIFICATION_TIMEOUT_HOURS:72}
app.verification.reminders-enabled=${VERIFICATION_REMINDERS_ENABLED:true}
app.verification.reminder-interval-hours=${VERIFICATION_REMINDER_INTERVAL_HOURS:24}
app.verification.reminder-check-interval-ms=${VERIFICATION_REMINDER_CHECK_INTERVAL_MS:300000}
app.verification.admin-override-enabled=${VERIFICATION_ADMIN_OVERRIDE_ENABLED:false}
app.verification.admin-override-delay-hours=${VERIFICATION_ADMIN_OVERRIDE_DELAY_HOURS:72}

# Analytics & SLA Dashboard Configuration
app.analytics.reporting-timezone=${ANALYTICS_TIMEZONE:UTC}
app.analytics.max-range-days=${ANALYTICS_MAX_RANGE_DAYS:366}
app.analytics.sla.low-hours=${ANALYTICS_SLA_LOW_HOURS:72}
app.analytics.sla.medium-hours=${ANALYTICS_SLA_MEDIUM_HOURS:48}
app.analytics.sla.high-hours=${ANALYTICS_SLA_HIGH_HOURS:24}
app.analytics.sla.urgent-hours=${ANALYTICS_SLA_URGENT_HOURS:12}
app.analytics.recurring-issue-threshold=${ANALYTICS_RECURRING_THRESHOLD:2}
