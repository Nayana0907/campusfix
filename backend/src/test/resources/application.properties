spring.application.name=campusfix-backend-test

# Use in-memory H2 database for fast, isolated, deterministic automated testing
spring.datasource.url=jdbc:h2:mem:campusfixtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test JWT configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=900000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://campusfix-phi.vercel.app,http://localhost:3000,http://localhost:5173}

# Complaint File Upload Configuration for testing
app.complaint.upload.dir=target/test-uploads
app.complaint.max-file-size-bytes=5242880
app.complaint.max-images-per-complaint=5

# Resolution Verification System Test Configuration
app.verification.timeout-hours=72
app.verification.reminders-enabled=false
app.verification.reminder-interval-hours=24
app.verification.reminder-check-interval-ms=600000
app.verification.admin-override-enabled=false
app.verification.admin-override-delay-hours=72

# Analytics & SLA Test Configuration
app.analytics.reporting-timezone=UTC
app.analytics.max-range-days=366
app.analytics.sla.low-hours=72
app.analytics.sla.medium-hours=48
app.analytics.sla.high-hours=24
app.analytics.sla.urgent-hours=12
app.analytics.recurring-issue-threshold=2
